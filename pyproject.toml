[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hidden-state-training"
version = "1.0.0"
description = "A comprehensive framework for training language models enhanced with hidden state representations"
readme = "README.md"
authors = [{ name = "Hidden State Training Team", email = "contact@hidden-state-training.com" }]
requires-python = ">=3.10,<3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache 2.0",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "torch==2.4.1",
    "torchvision==0.19.1",
    "transformers>=4.21.0",
    "datasets>=2.0.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "tqdm>=4.64.0",
    "matplotlib>=3.5.0",
    "deepspeed>=0.8.0",
    "accelerate>=0.18.0",
    "peft>=0.3.0",
    "pyarrow>=8.0.0",
    "tokenizers>=0.13.0",
    "pyyaml>=6.0",
    "click>=8.0.0",
    "colorama>=0.4.5",
    "requests>=2.28.0",
    "psutil>=5.9.0",
    "alfworld==0.3.5",
    "textworld==1.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "mypy>=1.0.0",
    "pre-commit>=2.20.0",
    "flake8>=5.0.0",
]
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "myst-parser>=0.18.0",
    "sphinx-autodoc-typehints>=1.19.0",
]
full = [
    "flash-attn>=2.0.0; sys_platform == 'linux'",
    "triton>=2.0.0",
]

[project.scripts]
hst-collect = "data_collection.collect_data:main"
hst-train = "core_training.train:train"
hst-compress = "compression_training.compress:main"
interlat-collect = "data_collection.collect_data:main"
interlat-train = "core_training.train:train"
interlat-compress = "compression_training.compress:main"

[project.urls]
Homepage = "https://github.com/XiaoDu-flying/Interlat"
"Bug Reports" = "https://github.com/XiaoDu-flying/Interlat/issues"
Source = "https://github.com/XiaoDu-flying/Interlat"

[tool.setuptools.packages.find]
include = [
    "compression_training",
    "compression_training.*",
    "core_training",
    "core_training.*",
    "data_collection",
    "data_collection.*",
    "eval",
    "eval.*",
]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml", "*.txt"]

[tool.uv.sources]
# vendor/ 不入 git，缺失时按 ENVIRONMENT.md「重建 vendor/textworld-1.6.1」操作
textworld = { path = "vendor/textworld-1.6.1" }

